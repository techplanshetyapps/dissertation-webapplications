<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<style>
        :root {
            --primary: #657b99;
            --secondary: #A9907E;
        }

.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: auto;
  overflow: auto; 
  z-index: 10;
  display: none;
  background-color: rgba(0, 0, 0, 0.5);
}

.overlay img {
  max-width: 90%;
  max-height: 90%;
  margin-top: 50px;
  border: 3px solid #2a2438; 
  border-radius: .25rem;
}

body {
  /* #background: url('{% static ".gif" %}') no-repeat center center fixed; */
  background-size: cover;
  /* background-color: #9CAFAA;  */
  color: #2a2438;
  transition: background-color 0.3s, color 0.3s; 
}

        * {
          font-family: "Fira Code", monospace;
        }

/* Switch styles */
.switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 34px;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: #ccc;
  transition: .4s;
  border-radius: 34px; 
}

.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: .4s;
  border-radius: 50%;
}

input:checked + .slider {
  background-color: #0c1845; 
}

input:checked + .slider:before {
  transform: translateX(26px); 
}



        #scrollToTopBtn {
            position: fixed;
            bottom: 2px; 
            right: 15px;
            z-index: 100;
            display: none; 
            background-color: transparent; 
            color: white;
            border: 2px solid #565F61; 
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

          #scrollToTopBtn:hover {
              background-color: #484f4f; 
              color: white; 
          }

.btn {
    font-weight: bold;
}

.dropdown-toggle {
    font-weight: bold;
}

.gradient {
  background-image: radial-gradient(circle at center right, 
    rgb(20, 30, 70) 0%,        rgb(20, 30, 70) 18%,      
    rgb(0, 110, 145) 18%,      rgb(0, 110, 145) 36%,     
    rgb(0, 175, 185) 36%,      rgb(0, 175, 185) 54%,   
    rgb(220, 245, 255) 54%,    rgb(220, 245, 255) 58%,    
    rgb(0, 175, 185) 58%,      rgb(0, 175, 185) 74%,    
    rgb(0, 110, 145) 74%,      rgb(0, 110, 145) 90%,     
    rgb(100, 210, 255) 90%,    rgb(100, 210, 255) 94%,    
    rgb(20, 30, 70) 94%,       rgb(20, 30, 70) 100%      
  );
  animation: move-gradient 5s ease-in-out infinite alternate;
  background-size: 200% 200%;
}

@keyframes move-gradient {
  0% {
    background-position: center right;
  }
  50% {
    background-position: center center;
  }
  100% {
    background-position: center left;
  }
}
</style>
</head>
<body class="gradient">

    <div class="relative text-gray-900 font-sans flex items-center justify-center min-h-screen" style="background-color: #6b848c !important;">
        <div class="absolute inset-0">
        </div>

        <div class="relative z-10 text-center text-white px-4">
            <h1 class="text-4xl font-bold text-gray-100 mb-4">Server is not found</h1>
            <p class="text-xl text-gray-300 mb-8">The is an external server error.</p>
        </div>
    </div>

<script type="text/javascript">
  if (document.addEventListener) {
      document.addEventListener('contextmenu', function (e) {
          e.preventDefault();
      }, false);
  } else {
      document.attachEvent('oncontextmenu', function () {
          window.event.returnValue = false;
      });
  }
</script>
<script type="text/javascript">
  function disableClick(){
    document.onclick = function(event){
      if (event.button == 2) {
        alert('Right Click Message');
        return false;
      }
    }
  }
</script>
<script type="text/javascript">
  document.addEventListener("keydown", function(e){
    if (e.ctrlKey || e.keyCode == 123) {
      e.stopPropagation();
      e.preventDefault();
    }
  });
</script>

<script type="text/javascript">

const toggle = document.getElementById('theme-toggle');
const body = document.body;

if (localStorage.getItem('theme') === 'dark') {
  body.classList.add('dark');
  toggle.checked = true; 
}

toggle.addEventListener('change', () => {
  if (toggle.checked) {
    body.classList.add('dark');
    localStorage.setItem('theme', 'dark');
  } else {
    body.classList.remove('dark');
    localStorage.setItem('theme', 'light');
  }
});


</script>
</body>
</html>
